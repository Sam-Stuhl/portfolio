<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eef2f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e151d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Today">
<title>Today</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef2f4; --surface: #ffffff; --sunk: #e3e9ed; --ink: #172230; --muted: #5a6877;
    --rule: #d3dbe1; --signal: #b87800; --signal-bg: #fff3d6; --late: #b3372a; --late-bg: #fbe6e2;
    --class: #2f6690; --event: #6a5aa6; --job: #22825f; --commute: #7d8894; --work: #a86a00; --task: #a86a00;
    --now: #d98e04;
    --shadow: 0 1px 0 rgba(23, 34, 48, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0e151d; --surface: #16202b; --sunk: #111a24; --ink: #e3eaf0; --muted: #8e9cab;
      --rule: #243241; --signal: #f2b230; --signal-bg: #2b2310; --late: #f08a7a; --late-bg: #2f1a17;
      --class: #7fb2d9; --event: #b3a6ea; --job: #6fcba6; --commute: #93a0ad; --work: #f0bb5a; --task: #f0bb5a;
      --now: #f2b230;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Archivo", system-ui, -apple-system, sans-serif; font-variation-settings: "wdth" 100;
    font-size: 16px; line-height: 1.45;
    padding: max(18px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }
  main { max-width: 980px; margin: 0 auto; }
  /* minmax(0, ...) so a wide child (the hourly strip) scrolls inside its
     panel instead of stretching the column past the screen. */
  .cols { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 820px) { .cols { grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); align-items: start; } }
  .stack { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }

  /* The masthead: date on the left, the weather on the right. */
  .mast { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin: 2px 2px 14px; }
  .date { font-size: 15px; color: var(--muted); }
  .date b { display: block; font-size: 22px; color: var(--ink); font-weight: 700;
            font-variation-settings: "wdth" 88; letter-spacing: -.01em; }
  .wx-now { display: flex; align-items: center; gap: 8px; text-align: right; }
  .wx-now svg { width: 34px; height: 34px; }
  .wx-temp { font-size: 34px; font-weight: 700; font-variation-settings: "wdth" 72; line-height: 1; }
  .wx-sub { font-size: 13px; color: var(--muted); }

  /* The hero: the one number that matters in the morning. */
  .hero { background: var(--surface); border-radius: 22px; padding: 18px 20px 20px;
          box-shadow: var(--shadow); border: 1px solid var(--rule); position: relative; overflow: hidden; }
  .hero::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--signal); }
  .hero.late::before { background: var(--late); }
  .hero.calm::before { background: var(--class); }
  .hero-kicker { font-size: 15px; color: var(--muted); }
  .hero-time { font-size: clamp(76px, 24vw, 132px); line-height: .88; font-weight: 800;
               font-variation-settings: "wdth" 62; letter-spacing: -.02em; color: var(--signal);
               font-variant-numeric: tabular-nums; margin: 4px 0 8px; }
  .hero.late .hero-time { color: var(--late); }
  .hero.calm .hero-time { color: var(--ink); font-size: clamp(54px, 16vw, 92px); }
  .hero-what { font-size: 19px; font-weight: 650; }
  .hero-how { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .pill { display: inline-block; margin-top: 12px; padding: 5px 11px; border-radius: 999px;
          background: var(--signal-bg); color: var(--signal); font-weight: 650; font-size: 14px; }
  .late .pill { background: var(--late-bg); color: var(--late); }
  .calm .pill { background: var(--sunk); color: var(--muted); }

  .panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 16px;
           padding: 14px 16px 16px; box-shadow: var(--shadow); }
  .panel h2 { font-size: 17px; font-weight: 700; margin: 0 0 10px; font-variation-settings: "wdth" 90; }
  .panel h2 small { font-weight: 450; color: var(--muted); font-size: 14px; margin-left: 6px; }

  /* The day view: a time grid like Cedar's, drawn to today's span. */
  .grid { position: relative; margin-left: 46px; }
  .hour { position: absolute; left: -46px; right: 0; border-top: 1px solid var(--rule);
          font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hour span { position: absolute; top: -8px; left: 0; width: 40px; background: var(--surface); }
  .block { position: absolute; border-radius: 9px; padding: 5px 8px; overflow: hidden;
           background: color-mix(in srgb, var(--k) 14%, var(--surface));
           border-left: 3px solid var(--k); font-size: 13.5px; line-height: 1.25; }
  .block b { display: block; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .block i { font-style: normal; color: var(--muted); white-space: nowrap; }
  .block.past { opacity: .5; }
  .block.short { padding-top: 3px; padding-bottom: 0; display: flex; gap: 6px; align-items: baseline; }
  .block.on { box-shadow: 0 0 0 2px var(--now); }
  .nowline { position: absolute; left: -6px; right: 0; height: 2px; background: var(--now); z-index: 3; }
  .nowline::before { content: ""; position: absolute; left: -4px; top: -4px; width: 10px; height: 10px;
                     border-radius: 50%; background: var(--now); }
  .empty { color: var(--muted); margin: 4px 0 0; }

  /* Weather by the hour: a strip you can scroll, rain as a bar. */
  .hours { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 0 4px 2px; }
  .hours::-webkit-scrollbar { display: none; }
  .h { flex: 0 0 50px; text-align: center; font-size: 13px; color: var(--muted); }
  .h svg { width: 24px; height: 24px; display: block; margin: 4px auto; }
  .h .t { color: var(--ink); font-weight: 650; font-size: 15px; }
  .rainbar { height: 34px; display: flex; align-items: flex-end; justify-content: center; margin-top: 4px; }
  .rainbar div { width: 12px; border-radius: 3px 3px 0 0; background: var(--class); opacity: .75; min-height: 2px; }
  .h .p { font-size: 11px; }
  .wx-line { font-size: 14px; color: var(--muted); margin-top: 8px; }

  /* Deadlines, grouped by how soon. */
  .group { margin-top: 10px; }
  .group:first-of-type { margin-top: 0; }
  .group h3 { font-size: 13.5px; font-weight: 650; color: var(--muted); margin: 0 0 4px; }
  .due { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--rule); }
  .group .due:first-of-type { border-top: 0; }
  .due .when { color: var(--muted); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .due.hot .when { color: var(--late); font-weight: 650; }
  .exam { display: inline-block; font-size: 12px; font-weight: 700; color: var(--late); margin-right: 6px; }

  .exams { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .ex { background: var(--sunk); border-radius: 12px; padding: 10px 12px; }
  .ex .n { font-size: 34px; font-weight: 800; font-variation-settings: "wdth" 62; line-height: 1; }
  .ex .n small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 3px; font-variation-settings: "wdth" 100; }
  .ex .t { font-weight: 600; font-size: 14px; margin-top: 4px; }
  .ex .w { color: var(--muted); font-size: 13px; }

  .need { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--rule); }
  .need:first-of-type { border-top: 0; padding-top: 0; }
  .need b { font-weight: 650; }
  .need .src { color: var(--muted); font-size: 13px; text-align: right; }
  .need .d { grid-column: 1 / -1; color: var(--muted); font-size: 14px; }

  .brief-h { font-size: 18px; font-weight: 650; margin: 0; }
  .brief-body { margin-top: 10px; }
  .brief-body p, .brief-body ul { margin: 0 0 8px; }
  .brief-body ul { padding-left: 18px; }
  .brief-body li { margin-bottom: 4px; }
  .brief-body code { font-size: 13px; background: var(--sunk); padding: 1px 5px; border-radius: 5px; }
  details summary { cursor: pointer; color: var(--class); font-weight: 600; margin-top: 8px; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details[open] summary { display: none; }

  .foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 18px; }
  .stale { background: var(--late-bg); color: var(--late); border-radius: 12px; padding: 9px 12px;
           font-size: 14px; margin-bottom: 12px; }
  button { font: inherit; color: var(--class); background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--now); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: no-preference) {
    .hero-time { animation: rise .5s cubic-bezier(.2, .7, .2, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<main>
  <div id="stale"></div>
  <div class="mast">
    <div class="date" id="date"></div>
    <div class="wx-now" id="wxnow"></div>
  </div>
  <div class="cols">
    <div class="stack">
      <div class="hero" id="hero"><div class="hero-kicker">Loading your day</div></div>
      <div class="panel" id="daypanel"><h2>Your day</h2><div id="day"></div></div>
    </div>
    <div class="stack">
      <div class="panel" id="wxpanel"><h2>Weather</h2><div id="wx"></div></div>
      <div class="panel" id="duepanel"><h2>Due</h2><div id="due"></div></div>
      <div class="panel" id="exampanel" hidden><h2>Exams coming up</h2><div class="exams" id="exams"></div></div>
      <div class="panel" id="needpanel" hidden><h2>Waiting on you</h2><div id="needs"></div></div>
      <div class="panel" id="briefpanel" hidden><h2>The brief</h2><div id="brief"></div></div>
    </div>
  </div>
  <div class="foot">Updated <span id="updated">just now</span>. <button type="button" id="refresh">Refresh</button></div>
</main>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let TZ = "America/New_York";

  const fmt = (d, opts) => new Intl.DateTimeFormat("en-US", { timeZone: TZ, ...opts }).format(d);
  const clock = (d) => fmt(d, { hour: "numeric", minute: "2-digit" }).replace(" ", " ");
  const hourOnly = (d) => fmt(d, { hour: "numeric" }).replace(" ", "").toLowerCase();
  // Minutes since local midnight in Sam's zone, whatever zone the phone is in.
  const minuteOfDay = (d) => {
    const [h, m] = fmt(d, { hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).split(":").map(Number);
    return h * 60 + m;
  };
  const dayKey = (d) => fmt(d, { year: "numeric", month: "2-digit", day: "2-digit" });
  const inMinutes = (ms) => Math.round(ms / 60000);
  const span = (m) => {
    const a = Math.abs(m);
    if (a < 60) return `${a} min`;
    const h = Math.floor(a / 60), r = a % 60;
    return r ? `${h} h ${r} min` : `${h} h`;
  };

  // Weather glyphs, drawn rather than fetched, by WMO code family.
  const ICON = {
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2" fill="#e8a317" stroke="#e8a317"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="#e8a317"/></svg>',
    part: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="9" r="3.4" fill="#e8a317" stroke="#e8a317"/><path d="M9 2.8v1.6M2.8 9h1.6M4.6 4.6l1.1 1.1M13.4 4.6l-1.1 1.1" stroke="#e8a317"/><path d="M8 19h9.5a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.4 1.5A2.8 2.8 0 0 0 8 19z" fill="currentColor" opacity=".35" stroke="currentColor"/></svg>',
    cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 18.5h10.5a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.6 1.6A3.3 3.3 0 0 0 7 18.5z" fill="currentColor" opacity=".3"/></svg>',
    rain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 14.5h10.5a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.6 1.6A3.3 3.3 0 0 0 7 14.5z" fill="currentColor" opacity=".3"/><path d="M8.5 17.5l-1 2.5M12.5 17.5l-1 2.5M16.5 17.5l-1 2.5" stroke="#3b82c4"/></svg>',
    snow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 14.5h10.5a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.6 1.6A3.3 3.3 0 0 0 7 14.5z" fill="currentColor" opacity=".3"/><path d="M9 18.5h.01M12 20h.01M15 18.5h.01" stroke-width="3"/></svg>',
    storm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 14.5h10.5a4 4 0 0 0 .4-8 5.6 5.6 0 0 0-10.6 1.6A3.3 3.3 0 0 0 7 14.5z" fill="currentColor" opacity=".3"/><path d="M12.5 15l-2 3.5h3l-2 3.5" stroke="#e8a317"/></svg>',
    fog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9h16M6 13h12M4 17h16" opacity=".6"/></svg>',
  };
  const iconFor = (code) => {
    if (code == null) return ICON.cloud;
    if (code <= 1) return ICON.sun;
    if (code === 2) return ICON.part;
    if (code === 3) return ICON.cloud;
    if (code === 45 || code === 48) return ICON.fog;
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ICON.snow;
    if (code >= 95) return ICON.storm;
    return ICON.rain;
  };

  function masthead(data, now) {
    const w = data.weather;
    $("date").innerHTML = `${esc(fmt(now, { weekday: "long" }))}<b>${esc(fmt(now, { month: "long", day: "numeric" }))}</b>`;
    $("wxnow").innerHTML = w
      ? `<div><div class="wx-temp">${w.temp}°</div><div class="wx-sub">${esc(w.label)}</div></div>${iconFor(w.code)}`
      : "";
  }

  function hero(data, now) {
    const el = $("hero");
    const leave = data.leave;
    if (leave) {
      const at = new Date(leave.at);
      const until = inMinutes(at - now);
      const late = until < 0;
      const planned = leave.planned ? ` Your plan says ${clock(new Date(leave.planned))}.` : "";
      el.className = "hero" + (late ? " late" : "");
      el.innerHTML = `
        <div class="hero-kicker">${late ? "You should have left at" : "Leave by"}</div>
        <div class="hero-time">${esc(clock(at))}</div>
        <div class="hero-what">${esc(leave.for)}${leave.where ? ` in ${esc(leave.where)}` : ""} at ${esc(clock(new Date(leave.start)))}</div>
        <div class="hero-how">${leave.minutes} min drive plus ${leave.buffer} min to spare.${esc(planned)}</div>
        <div class="pill">${late ? `${span(until)} late` : until === 0 ? "Leave now" : `in ${span(until)}`}</div>`;
      return;
    }
    const day = data.day || [];
    const current = day.find((e) => new Date(e.start) <= now && new Date(e.end) > now);
    const next = day.find((e) => new Date(e.start) > now);
    el.className = "hero calm";
    if (next) {
      const start = new Date(next.start);
      const lead = current ? `Now: ${esc(current.title)}. Next up` : "Next up";
      el.innerHTML = `
        <div class="hero-kicker">${lead}</div>
        <div class="hero-time">${esc(clock(start))}</div>
        <div class="hero-what">${esc(next.title)}</div>
        <div class="hero-how">${esc(next.where || "")}</div>
        <div class="pill">in ${span(inMinutes(start - now))}</div>`;
    } else if (current) {
      el.innerHTML = `
        <div class="hero-kicker">Happening now</div>
        <div class="hero-time">${esc(clock(new Date(current.end)))}</div>
        <div class="hero-what">${esc(current.title)} ends</div>
        <div class="hero-how">Nothing after it today.</div>`;
    } else {
      el.innerHTML = `
        <div class="hero-kicker">The rest of today</div>
        <div class="hero-time">Clear</div>
        <div class="hero-what">Nothing else on the calendar.</div>`;
    }
  }

  function dayView(data, now) {
    const events = (data.day || []).map((e) => ({ ...e, s: new Date(e.start), f: new Date(e.end) }));
    if (!events.length) { $("day").innerHTML = '<p class="empty">Nothing on the calendar today.</p>'; return; }
    const nowMin = minuteOfDay(now);
    const first = Math.min(...events.map((e) => minuteOfDay(e.s)), nowMin);
    const last = Math.max(...events.map((e) => minuteOfDay(e.f) || 24 * 60), nowMin);
    const startH = Math.max(0, Math.floor(first / 60) - (first % 60 < 20 ? 1 : 0));
    const endH = Math.min(24, Math.ceil(last / 60));
    const px = 0.8; // pixels per minute
    const top = (min) => (min - startH * 60) * px;

    // Side by side when two things overlap, the way Cedar lays them out.
    const cols = [];
    events.forEach((e) => {
      const a = minuteOfDay(e.s);
      let c = cols.findIndex((end) => end <= a);
      if (c === -1) { c = cols.length; cols.push(0); }
      cols[c] = minuteOfDay(e.f) || 24 * 60;
      e.col = c;
    });
    const width = 100 / Math.max(1, cols.length);

    let html = "";
    for (let h = startH; h <= endH; h++) {
      html += `<div class="hour" style="top:${top(h * 60)}px"><span>${h === 12 ? "noon" : h % 12 === 0 ? "12am" : (h % 12) + (h < 12 ? "am" : "pm")}</span></div>`;
    }
    events.forEach((e) => {
      const a = minuteOfDay(e.s), b = Math.max(minuteOfDay(e.f) || 24 * 60, a + 25);
      const state = e.f <= now ? "past" : e.s <= now ? "on" : "";
      const tall = (b - a) * px;
      html += `<div class="block ${state}${tall < 34 ? " short" : ""}" style="--k:var(--${esc(e.kind)}, var(--event));top:${top(a)}px;height:${tall - 3}px;left:calc(${e.col * width}% + 2px);width:calc(${width}% - 4px)">
        <b>${esc(e.title)}</b>${tall >= 34 ? `<i>${esc(clock(e.s))}${e.where ? `, ${esc(e.where)}` : ""}</i>` : ""}</div>`;
    });
    if (nowMin >= startH * 60 && nowMin <= endH * 60) html += `<div class="nowline" style="top:${top(nowMin)}px"></div>`;
    $("day").innerHTML = `<div class="grid" style="height:${(endH - startH) * 60 * px}px">${html}</div>`;
    const dayNote = $("daypanel").querySelector("h2");
    const left = events.filter((e) => e.s > now).length;
    dayNote.innerHTML = `Your day<small>${left ? `${left} more to go` : "all done"}</small>`;
  }

  function weather(data, now) {
    const w = data.weather;
    $("wxpanel").hidden = !w;
    if (!w) return;
    const hours = (w.hours || []).slice(0, 12);
    const wettest = hours.reduce((m, h) => (h.rain > m.rain ? h : m), { rain: -1 });
    let advice = `High ${w.hi}°, low ${w.lo}°. Feels like ${w.feels}° now.`;
    if (wettest.rain >= 40) advice += ` Rain likely around ${hourOnly(new Date(wettest.t + ":00"))}, take a jacket.`;
    else if (w.rain < 20) advice += " Dry all day.";
    const sunset = w.sunset ? ` Sunset ${clock(new Date(w.sunset + ":00"))}.` : "";
    $("wx").innerHTML = `<div class="hours">${hours.map((h, i) => `
      <div class="h"><div>${i === 0 ? "Now" : esc(hourOnly(new Date(h.t + ":00")))}</div>${iconFor(h.code)}<div class="t">${h.temp}°</div>
      <div class="rainbar" title="${h.rain}% chance of rain"><div style="height:${Math.max(2, h.rain * 0.34)}px"></div></div><div class="p">${h.rain}%</div></div>`).join("")}</div>
      <div class="wx-line">${esc(advice)}${esc(sunset)}</div>`;
  }

  function due(data, now) {
    const items = (data.due || []).map((i) => ({ ...i, at: i.all_day ? new Date(i.when + "T23:59:00") : new Date(i.when) }))
      .filter((i) => i.at > now);
    if (!items.length) { $("due").innerHTML = '<p class="empty">Nothing due this week.</p>'; return; }
    const today = dayKey(now), tomorrow = dayKey(new Date(now.getTime() + 86400000));
    const groups = { "Today": [], "Tomorrow": [], "Later this week": [] };
    items.forEach((i) => {
      const k = dayKey(i.at);
      (k === today ? groups["Today"] : k === tomorrow ? groups["Tomorrow"] : groups["Later this week"]).push(i);
    });
    $("due").innerHTML = Object.entries(groups).filter(([, list]) => list.length).map(([name, list]) => `
      <div class="group"><h3>${name}</h3>${list.map((i) => {
        const when = i.all_day ? (name === "Later this week" ? fmt(i.at, { weekday: "short" }) : "any time")
          : (name === "Later this week" ? `${fmt(i.at, { weekday: "short" })} ${clock(i.at)}` : clock(i.at));
        const hot = name !== "Later this week";
        return `<div class="due ${hot ? "hot" : ""}"><div>${i.exam ? '<span class="exam">Exam</span>' : ""}${esc(i.title.trim())}</div><div class="when">${esc(when)}</div></div>`;
      }).join("")}</div>`).join("");
  }

  function exams(data, now) {
    const list = (data.exams || []).filter((e) => new Date(e.start) > now);
    $("exampanel").hidden = !list.length;
    $("exams").innerHTML = list.map((e) => {
      const s = new Date(e.start);
      const days = Math.round((new Date(dayKey(s)) - new Date(dayKey(now))) / 86400000);
      const n = days === 0 ? `<div class="n">Today</div>` : `<div class="n">${days}<small>${days === 1 ? "day" : "days"}</small></div>`;
      return `<div class="ex">${n}<div class="t">${esc(e.title)}</div><div class="w">${esc(fmt(s, { weekday: "short" }))} ${esc(clock(s))}${e.where ? `, ${esc(e.where)}` : ""}</div></div>`;
    }).join("");
  }

  function needs(data) {
    const list = data.needs || [];
    $("needpanel").hidden = !list.length;
    $("needs").innerHTML = list.map((n) => `
      <div class="need"><b>${esc(n.what)}</b><div class="src">${esc(n.where || "")}</div>${n.detail ? `<div class="d">${esc(n.detail)}</div>` : ""}</div>`).join("");
  }

  function brief(data, now) {
    const b = data.brief;
    $("briefpanel").hidden = !b;
    if (!b) return;
    const old = b.date && b.date !== data.date ? `<p class="empty">From ${esc(b.date)}; today's is written at 6.</p>` : "";
    // b.html was escaped and built on the mini (atlas/briefs.py to_html).
    $("brief").innerHTML = `<p class="brief-h">${esc(b.headline)}</p>${old}
      <details><summary>Read the whole brief</summary><div class="brief-body">${b.html}</div></details>`;
  }

  async function load() {
    const now = new Date();
    let data;
    try {
      const res = await fetch(location.pathname.replace(/\/$/, "") + "/data", { cache: "no-store" });
      if (!res.ok) throw new Error(String(res.status));
      data = await res.json();
    } catch (err) {
      $("stale").innerHTML = '<div class="stale">ATLAS has not sent today\'s dashboard yet. It updates every five minutes from the mini.</div>';
      return;
    }
    TZ = data.tz || TZ;
    const age = inMinutes(now - new Date(data.generated_at));
    $("stale").innerHTML = age > 20 ? `<div class="stale">Last updated ${span(age)} ago. The Mac mini may be offline, so this may be out of date.</div>` : "";
    masthead(data, now); hero(data, now); dayView(data, now); weather(data, now);
    due(data, now); exams(data, now); needs(data); brief(data, now);
    $("updated").textContent = clock(new Date(data.generated_at));
  }

  $("refresh").addEventListener("click", load);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  setInterval(load, 2 * 60 * 1000);
  load();
})();
</script>
</body>
</html>
