<!-- samstuhl.com. The mark on a plate, matching the composition of the
     180px apple-touch icon. The 16-unit grid keeps every edge on a whole pixel
     at 16px, and the plate is what makes the ink bars visible on a dark tab
     bar. Master and originals: docs/brand/. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect x="0" y="0" width="16" height="16" fill="#FFFFFF"/>
  <rect x="1" y="1" width="14" height="4" fill="#2E2C29"/>
  <rect x="1" y="6" width="4" height="4" fill="#2E2C29"/>
  <rect x="6" y="6" width="9" height="4" fill="#136A6F"/>
  <rect x="1" y="11" width="14" height="4" fill="#2E2C29"/>
</svg>
