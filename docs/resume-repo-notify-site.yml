name: notify site

# Careerbase pushes resume.json and resume.pdf here on every save. The site at
# samstuhl.com/resume bakes both into its Worker bundle at build time, so it has
# to be told to rebuild.

on:
  push:
    branches: [main]
    paths:
      - resume.json
      - resume.pdf
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: ask the site to rebuild
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: gh api repos/Sam-Stuhl/portfolio/dispatches -f event_type=resume-updated

# Lives here for reference only. Its real home is
# Sam-Stuhl/resume/.github/workflows/notify-site.yml, and it needs a
# PORTFOLIO_DISPATCH_TOKEN secret in that repo: a fine-grained PAT scoped to
# Sam-Stuhl/portfolio alone with Contents: Read and write.
