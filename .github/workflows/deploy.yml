name: deploy

on:
  push:
    branches: [main]
  # Fired by Sam-Stuhl/resume whenever Careerbase pushes a new résumé.
  repository_dispatch:
    types: [resume-updated]
  workflow_dispatch:

# Two résumé saves in quick succession must not race each other onto the edge.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Sam's runner on the mini (ghrunner), since GitHub-hosted jobs stopped
    # starting on the account. Homebrew's node. See planner's
    # ops/tests-runner/README.md, "Other repos on the same account".
    runs-on: [self-hosted, macOS, portfolio]
    steps:
      - uses: actions/checkout@v4

      - run: node --version

      - run: npm ci

      # Pulls resume.json and resume.pdf from Sam-Stuhl/resume, then renders.
      - run: npm run build

      - run: npm run check

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: verify the live endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            code=$(curl -sS -o /tmp/resume.html -w '%{http_code}' https://samstuhl.com/resume || true)
            if [ "$code" = "200" ] && grep -q 'Samuel Stuhl' /tmp/resume.html; then
              echo "live after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "https://samstuhl.com/resume did not come back healthy"
          exit 1
